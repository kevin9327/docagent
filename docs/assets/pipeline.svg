<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Picture in: Markdown DOCX ODT HTML with PNG or JPEG. One integer engine. PDF/A out with that picture as an XObject. Three capsule hashes. Not OCR.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" rx="24" fill="url(#pbg)"/>
  <text x="40" y="42" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="3">PICTURE IN · PDF/A OUT · NOT OCR</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial">
    <rect x="40" y="70" width="250" height="160" rx="16" fill="#111827" stroke="#1f2937"/>
    <text x="165" y="104" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">INPUT</text>
    <text x="165" y="136" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">MD · DOCX · ODT</text>
    <text x="165" y="162" text-anchor="middle" fill="#cbd5e1" font-size="16">HTML + PNG / JPEG</text>
    <text x="165" y="198" text-anchor="middle" fill="#5eead4" font-size="13">![alt](photo.png)</text>

    <polygon points="304,150 332,138 332,162" fill="#2dd4bf"/>

    <rect x="348" y="70" width="300" height="160" rx="16" fill="#042f2e" stroke="#134e4a"/>
    <text x="498" y="104" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">ONE ENGINE</text>
    <text x="498" y="140" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">IR + layout</text>
    <text x="498" y="168" text-anchor="middle" fill="#99f6e4" font-size="16">integer 1/7200 inch</text>
    <text x="498" y="200" text-anchor="middle" fill="#5eead4" font-size="13">GPU-free · embed, do not OCR</text>

    <polygon points="662,150 690,138 690,162" fill="#2dd4bf"/>

    <rect x="706" y="70" width="250" height="160" rx="16" fill="#111827" stroke="#1f2937"/>
    <text x="831" y="104" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">OUTPUT</text>
    <text x="831" y="136" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">PDF/A</text>
    <text x="831" y="162" text-anchor="middle" fill="#cbd5e1" font-size="15">teal mark under H2</text>
    <text x="831" y="190" text-anchor="middle" fill="#cbd5e1" font-size="15">picture as XObject</text>
    <text x="831" y="214" text-anchor="middle" fill="#64748b" font-size="12">HTML · DOCX · ODT · same bytes</text>

    <polygon points="970,150 998,138 998,162" fill="#2dd4bf"/>

    <rect x="1014" y="70" width="226" height="160" rx="16" fill="#0b1220" stroke="#2dd4bf"/>
    <text x="1127" y="104" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">CAPSULE</text>
    <text x="1127" y="140" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">3 × SHA-256</text>
    <text x="1127" y="168" text-anchor="middle" fill="#99f6e4" font-size="15">input · plan · output</text>
    <text x="1127" y="200" text-anchor="middle" fill="#64748b" font-size="13">agent-replayable</text>
  </g>
</svg>
