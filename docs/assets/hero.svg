    <rect x="380" y="132" width="78" height="22" rx="11" fill="#1e293b"/><text x="419" y="147" fill="#94a3b8" text-anchor="middle">PNG/JPEG</text>
    <rect x="464" y="132" width="70" height="22" rx="11" fill="#0b1220" stroke="#2dd4bf"/><text x="499" y="147" fill="#5eead4" text-anchor="middle">C / Q / E</text>
    <rect x="540" y="132" width="88" height="22" rx="11" fill="#0b1220" stroke="#2dd4bf"/><text x="584" y="147" fill="#5eead4" text-anchor="middle">SHA-256 ×3</text>
  </g>

  <text x="40" y="176" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="12">in b0f44237 · plan 4b7360eb · out b468b37f  ← letter-capsule.json · WeasyPrint tightness not claimed</text>
  <text x="40" y="192" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12" font-weight="700">teal mark under H2 · same input + fonts → same bytes · we do not OCR</text>

