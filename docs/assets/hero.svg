<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="DocAgent — picture in, PDF/A out. Capsule hashed. GPU-free. Not OCR.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0b1c24"/>
      <stop offset="100%" stop-color="#102a28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1180" cy="420" r="140" fill="#2dd4bf" fill-opacity="0.08" filter="url(#soft)"/>

  <text x="64" y="84" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="18" font-weight="700" letter-spacing="4">AGENT DOCUMENT RUNTIME</text>
  <text x="64" y="158" fill="#f8fafc" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="72" font-weight="800">DocAgent</text>
  <text x="64" y="214" fill="#f8fafc" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="28" font-weight="700">Picture in. PDF/A out.</text>
  <text x="64" y="254" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="20">PNG or JPEG → PDF/A XObject. Capsule hashed. GPU-free.</text>
  <text x="64" y="286" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="18">We embed the bytes you already have. Not OCR. Not a VLM.</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700">
    <rect x="64" y="322" width="92" height="36" rx="18" fill="#134e4a"/>
    <text x="110" y="346" fill="#99f6e4" text-anchor="middle">DOCX</text>
    <rect x="168" y="322" width="80" height="36" rx="18" fill="#134e4a"/>
    <text x="208" y="346" fill="#99f6e4" text-anchor="middle">ODT</text>
    <rect x="260" y="322" width="118" height="36" rx="18" fill="#134e4a"/>
    <text x="319" y="346" fill="#99f6e4" text-anchor="middle">Markdown</text>
    <rect x="390" y="322" width="86" height="36" rx="18" fill="#134e4a"/>
    <text x="433" y="346" fill="#99f6e4" text-anchor="middle">HTML</text>
    <rect x="488" y="322" width="96" height="36" rx="18" fill="#115e59"/>
    <text x="536" y="346" fill="#ccfbf1" text-anchor="middle">PDF/A</text>
    <rect x="596" y="322" width="108" height="36" rx="18" fill="#1e293b"/>
    <text x="650" y="346" fill="#94a3b8" text-anchor="middle">PNG/JPEG</text>
  </g>

  <text x="64" y="400" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="15">![seal](photo.png)  →  PDF/A XObject  ·  SHA-256 ×3</text>
  <text x="64" y="452" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700">same input + fonts → same bytes · no GPU bill</text>

  <g transform="translate(820,64)">
    <g transform="rotate(-10 200 200)">
      <rect x="86" y="52" width="220" height="292" rx="10" fill="#334155"/>
      <rect x="94" y="60" width="204" height="276" rx="8" fill="#1e293b"/>
      <rect x="114" y="88" width="72" height="54" rx="6" fill="#0f766e"/>
      <rect x="114" y="156" width="140" height="6" rx="3" fill="#475569"/>
      <rect x="114" y="174" width="120" height="6" rx="3" fill="#334155"/>
    </g>
    <g>
      <rect x="118" y="36" width="228" height="304" rx="10" fill="#f8fafc"/>
      <rect x="118" y="36" width="228" height="304" rx="10" fill="none" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="140" y="58" width="120" height="9" rx="4.5" fill="#0f766e"/>
      <rect x="140" y="80" width="184" height="92" rx="8" fill="url(#photo)"/>
      <circle cx="178" cy="112" r="16" fill="#ccfbf1" fill-opacity="0.55"/>
      <polygon points="156,156 188,124 232,148 232,164 156,164" fill="#042f2e" fill-opacity="0.45"/>
      <text x="232" y="98" text-anchor="middle" fill="#ecfeff" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">PHOTO</text>
      <rect x="140" y="186" width="168" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="140" y="204" width="152" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="140" y="222" width="136" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="140" y="250" width="88" height="22" rx="11" fill="#134e4a"/>
      <text x="184" y="266" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">PDF/A</text>
      <rect x="236" y="250" width="72" height="22" rx="11" fill="#134e4a"/>
      <text x="272" y="266" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">XObject</text>
      <text x="232" y="312" text-anchor="middle" fill="#0f766e" font-family="ui-monospace, Consolas, monospace" font-size="10">picture in · bytes out</text>
    </g>
  </g>
</svg>
