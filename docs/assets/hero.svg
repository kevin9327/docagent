<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="DocAgent — picture in, PDF/A out. Command Convert. Capsule SHA-256 times 3. GPU-free. Not OCR.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0b1c24"/>
      <stop offset="100%" stop-color="#102a28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="200" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="8" r="110" fill="url(#glow)" filter="url(#soft)"/>

  <text x="40" y="28" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12" font-weight="700" letter-spacing="3">AGENT DOCUMENT RUNTIME · NOT OCR · NOT A SUITE</text>
  <text x="40" y="68" fill="#f8fafc" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="42" font-weight="800">DocAgent</text>
  <text x="40" y="96" fill="#f8fafc" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700">Picture in. PDF/A out. Capsule hashed. GPU-free.</text>
  <text x="40" y="118" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13">Command::Convert embeds PNG/JPEG as a PDF/A XObject. Same fonts → same bytes.</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">
