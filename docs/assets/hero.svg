<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="DocAgent — deterministic document runtime for agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0b1c24"/>
      <stop offset="100%" stop-color="#102a28"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1180" cy="420" r="140" fill="#2dd4bf" fill-opacity="0.08" filter="url(#soft)"/>

  <text x="64" y="92" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="18" font-weight="700" letter-spacing="4">AGENT DOCUMENT RUNTIME</text>
  <text x="64" y="168" fill="#f8fafc" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="72" font-weight="800">DocAgent</text>
  <text x="64" y="222" fill="#cbd5e1" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="24">Deterministic convert. Capsule hashed. GPU-free.</text>
  <text x="64" y="258" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="20">Integer 1/7200 in. PNG + JPEG on five codecs. No VLM.</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700">
    <rect x="64" y="312" width="92" height="36" rx="18" fill="#134e4a"/>
    <text x="110" y="336" fill="#99f6e4" text-anchor="middle">DOCX</text>
    <rect x="168" y="312" width="80" height="36" rx="18" fill="#134e4a"/>
    <text x="208" y="336" fill="#99f6e4" text-anchor="middle">ODT</text>
    <rect x="260" y="312" width="118" height="36" rx="18" fill="#134e4a"/>
    <text x="319" y="336" fill="#99f6e4" text-anchor="middle">Markdown</text>
    <rect x="390" y="312" width="86" height="36" rx="18" fill="#134e4a"/>
    <text x="433" y="336" fill="#99f6e4" text-anchor="middle">HTML</text>
    <rect x="488" y="312" width="96" height="36" rx="18" fill="#115e59"/>
    <text x="536" y="336" fill="#ccfbf1" text-anchor="middle">PDF/A</text>
    <rect x="596" y="312" width="268" height="36" rx="18" fill="#1e293b"/>
    <text x="730" y="336" fill="#94a3b8" text-anchor="middle">HWP · HWPX · HML · HWP 3</text>
  </g>

  <text x="64" y="392" fill="#64748b" font-family="ui-monospace, Consolas, monospace" font-size="15">docagent convert letter.docx --pdf out.pdf --html out.html --capsule cap.json</text>
  <text x="64" y="448" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700">same input + fonts → same bytes · SHA-256 on input, plan, output</text>

  <!-- stacked pages -->
  <g transform="translate(860,78)">
    <g transform="rotate(-11 180 180)">
      <rect x="70" y="40" width="220" height="292" rx="10" fill="#334155"/>
      <rect x="78" y="48" width="204" height="276" rx="8" fill="#1e293b"/>
    </g>
    <g transform="rotate(-4 180 180)">
      <rect x="86" y="36" width="220" height="292" rx="10" fill="#94a3b8"/>
      <rect x="94" y="44" width="204" height="276" rx="8" fill="url(#page)"/>
      <rect x="114" y="72" width="140" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="114" y="96" width="164" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="114" y="114" width="152" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="114" y="132" width="120" height="6" rx="3" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="108" y="28" width="220" height="292" rx="10" fill="#f8fafc"/>
      <rect x="108" y="28" width="220" height="292" rx="10" fill="none" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="132" y="58" width="128" height="10" rx="5" fill="#0f766e"/>
      <rect x="132" y="88" width="172" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="132" y="108" width="160" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="132" y="128" width="148" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="132" y="156" width="172" height="54" rx="8" fill="#ecfdf5"/>
      <rect x="144" y="172" width="90" height="6" rx="3" fill="#5eead4"/>
      <rect x="144" y="188" width="148" height="6" rx="3" fill="#99f6e4"/>
      <rect x="132" y="228" width="80" height="22" rx="11" fill="#134e4a"/>
      <text x="172" y="244" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">PDF/A</text>
      <rect x="220" y="228" width="72" height="22" rx="11" fill="#134e4a"/>
      <text x="256" y="244" text-anchor="middle" fill="#99f6e4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="11" font-weight="700">HTML</text>
      <text x="218" y="292" text-anchor="middle" fill="#0f766e" font-family="ui-monospace, Consolas, monospace" font-size="10">sha256 · capsule</text>
    </g>
  </g>
</svg>
