<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Shipped IR marks: PNG and JPEG on MD HTML PDF DOCX ODT. PDF float, cell images, page header/footer. DOCX wrapSquare, behindDoc, inFront. ODT nested lists, tight wrap, cell images. HTML reads img data-URI, lists, table headers, blockquote, pre, a, mark — not HTML5. Hangul CHAR_SHAPE, hyperlinks, Quote, CodeBlock, HorizontalLine, Task, highlight, Bullet/Number lists, table headers except HWP 3. Dash on Hangul: images. No OCR or OmniDocBench.">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" rx="24" fill="url(#sbg)"/>
  <text x="40" y="36" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="3">SHIPS ON ONE IR — NOT A VLM, NOT OCR</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="73" y="71" text-anchor="middle" fill="#99f6e4">lists</text>
    <rect x="114" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="147" y="71" text-anchor="middle" fill="#99f6e4">links</text>
    <rect x="188" y="50" width="70" height="32" rx="16" fill="#134e4a"/><text x="223" y="71" text-anchor="middle" fill="#99f6e4">strike</text>
    <rect x="266" y="50" width="76" height="32" rx="16" fill="#134e4a"/><text x="304" y="71" text-anchor="middle" fill="#99f6e4">quotes</text>
    <rect x="350" y="50" width="64" height="32" rx="16" fill="#134e4a"/><text x="382" y="71" text-anchor="middle" fill="#99f6e4">code</text>
    <rect x="422" y="50" width="92" height="32" rx="16" fill="#134e4a"/><text x="468" y="71" text-anchor="middle" fill="#99f6e4">thematic</text>
    <rect x="522" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="555" y="71" text-anchor="middle" fill="#99f6e4">tasks</text>
    <rect x="596" y="50" width="94" height="32" rx="16" fill="#134e4a"/><text x="643" y="71" text-anchor="middle" fill="#99f6e4">highlight</text>
    <rect x="698" y="50" width="102" height="32" rx="16" fill="#134e4a"/><text x="749" y="71" text-anchor="middle" fill="#99f6e4">super / sub</text>
    <rect x="808" y="50" width="94" height="32" rx="16" fill="#115e59"/><text x="855" y="71" text-anchor="middle" fill="#ccfbf1">underline</text>
    <rect x="910" y="50" width="78" height="32" rx="16" fill="#115e59"/><text x="949" y="71" text-anchor="middle" fill="#ccfbf1">PNG/JPEG</text>
    <rect x="996" y="50" width="108" height="32" rx="16" fill="#115e59"/><text x="1050" y="71" text-anchor="middle" fill="#ccfbf1">table hdr</text>
    <rect x="1112" y="50" width="108" height="32" rx="16" fill="#115e59"/><text x="1166" y="71" text-anchor="middle" fill="#ccfbf1">HTML read</text>
  </g>

  <text x="40" y="96" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12">PDF float+cell+header/footer · DOCX wrapSquare+behindDoc+inFront · ODT Tight+nested list+cell · HTML read: img data: · lists · th/thead · blockquote · pre · a · mark · not HTML5 · letter.md has no image</text>
  <text x="40" y="118" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="2">HANGUL YES — SAME IR, FOUR CODECS</text>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="128" width="158" height="30" rx="15" fill="#1e293b"/><text x="119" y="148" text-anchor="middle" fill="#e2e8f0">CHAR_SHAPE marks</text>
    <rect x="206" y="128" width="112" height="30" rx="15" fill="#1e293b"/><text x="262" y="148" text-anchor="middle" fill="#e2e8f0">hyperlinks</text>
    <rect x="326" y="128" width="80" height="30" rx="15" fill="#134e4a"/><text x="366" y="148" text-anchor="middle" fill="#99f6e4">Quote</text>
    <rect x="414" y="128" width="104" height="30" rx="15" fill="#134e4a"/><text x="466" y="148" text-anchor="middle" fill="#99f6e4">CodeBlock</text>
    <rect x="526" y="128" width="132" height="30" rx="15" fill="#134e4a"/><text x="592" y="148" text-anchor="middle" fill="#99f6e4">HorizontalLine</text>
    <rect x="666" y="128" width="58" height="30" rx="15" fill="#134e4a"/><text x="695" y="148" text-anchor="middle" fill="#99f6e4">Task</text>
    <rect x="732" y="128" width="88" height="30" rx="15" fill="#134e4a"/><text x="776" y="148" text-anchor="middle" fill="#99f6e4">highlight</text>
    <rect x="828" y="128" width="72" height="30" rx="15" fill="#134e4a"/><text x="864" y="148" text-anchor="middle" fill="#99f6e4">Bullet</text>
    <rect x="908" y="128" width="84" height="30" rx="15" fill="#134e4a"/><text x="950" y="148" text-anchor="middle" fill="#99f6e4">Number</text>
    <rect x="1000" y="128" width="160" height="30" rx="15" fill="#134e4a"/><text x="1080" y="148" text-anchor="middle" fill="#99f6e4">tbl hdr · not HWP 3</text>
  </g>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700">
    <rect x="40" y="166" width="70" height="26" rx="13" fill="#0b1220" stroke="#334155"/><text x="75" y="184" text-anchor="middle" fill="#64748b">HWP 5</text>
    <rect x="118" y="166" width="70" height="26" rx="13" fill="#0b1220" stroke="#334155"/><text x="153" y="184" text-anchor="middle" fill="#64748b">HWPX</text>
    <rect x="196" y="166" width="70" height="26" rx="13" fill="#0b1220" stroke="#334155"/><text x="231" y="184" text-anchor="middle" fill="#64748b">HWP 3</text>
    <rect x="274" y="166" width="56" height="26" rx="13" fill="#0b1220" stroke="#334155"/><text x="302" y="184" text-anchor="middle" fill="#64748b">HML</text>
  </g>

  <text x="40" y="214" fill="#64748b" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12" font-weight="700" letter-spacing="2">NOT YET ON HANGUL</text>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700">
    <rect x="40" y="224" width="90" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="85" y="244" text-anchor="middle" fill="#64748b">images</text>
  </g>
  <text x="148" y="244" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="13">not claimed: OCR · VLM · OmniDocBench</text>
</svg>
