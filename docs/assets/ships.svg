    <rect x="960" y="138" width="70" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="995" y="160" text-anchor="middle" fill="#64748b">HWPX</text>
    <rect x="1038" y="138" width="70" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="1073" y="160" text-anchor="middle" fill="#64748b">HWP 3</text>
    <rect x="1116" y="138" width="56" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="1144" y="160" text-anchor="middle" fill="#64748b">HML</text>
  </g>

  <text x="40" y="208" fill="#64748b" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12" font-weight="700" letter-spacing="2">NOT YET ON HANGUL</text>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700">
    <rect x="40" y="222" width="90" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="85" y="242" text-anchor="middle" fill="#64748b">images</text>
    <rect x="138" y="222" width="70" height="30" rx="15" fill="#134e4a"/><text x="173" y="242" text-anchor="middle" fill="#99f6e4">lists</text>
    <rect x="216" y="222" width="160" height="30" rx="15" fill="#134e4a"/><text x="296" y="242" text-anchor="middle" fill="#99f6e4">tbl hdr · not HWP 3</text>
  </g>
  <text x="552" y="242" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="13">not claimed: OCR · VLM · OmniDocBench</text>
</svg>
