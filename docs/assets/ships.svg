<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Shipped IR marks including images and Hangul Quote, CodeBlock, HorizontalLine, Task. Hangul still dashes images, highlight, lists, table headers.">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" rx="24" fill="url(#sbg)"/>
  <text x="40" y="36" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="3">SHIPS ON ONE IR — NOT A VLM, NOT OCR</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="73" y="71" text-anchor="middle" fill="#99f6e4">lists</text>
    <rect x="114" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="147" y="71" text-anchor="middle" fill="#99f6e4">links</text>
    <rect x="188" y="50" width="70" height="32" rx="16" fill="#134e4a"/><text x="223" y="71" text-anchor="middle" fill="#99f6e4">strike</text>
    <rect x="266" y="50" width="76" height="32" rx="16" fill="#134e4a"/><text x="304" y="71" text-anchor="middle" fill="#99f6e4">quotes</text>
    <rect x="350" y="50" width="64" height="32" rx="16" fill="#134e4a"/><text x="382" y="71" text-anchor="middle" fill="#99f6e4">code</text>
    <rect x="422" y="50" width="92" height="32" rx="16" fill="#134e4a"/><text x="468" y="71" text-anchor="middle" fill="#99f6e4">thematic</text>
    <rect x="522" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="555" y="71" text-anchor="middle" fill="#99f6e4">tasks</text>
    <rect x="596" y="50" width="94" height="32" rx="16" fill="#134e4a"/><text x="643" y="71" text-anchor="middle" fill="#99f6e4">highlight</text>
    <rect x="698" y="50" width="102" height="32" rx="16" fill="#134e4a"/><text x="749" y="71" text-anchor="middle" fill="#99f6e4">super / sub</text>
    <rect x="808" y="50" width="94" height="32" rx="16" fill="#115e59"/><text x="855" y="71" text-anchor="middle" fill="#ccfbf1">underline</text>
    <rect x="910" y="50" width="78" height="32" rx="16" fill="#115e59"/><text x="949" y="71" text-anchor="middle" fill="#ccfbf1">images</text>
    <rect x="996" y="50" width="108" height="32" rx="16" fill="#115e59"/><text x="1050" y="71" text-anchor="middle" fill="#ccfbf1">table hdr</text>
  </g>

  <text x="40" y="118" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="2">HANGUL YES — SAME IR, FOUR CODECS</text>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="134" width="168" height="34" rx="17" fill="#1e293b"/><text x="124" y="156" text-anchor="middle" fill="#e2e8f0">CHAR_SHAPE marks</text>
    <rect x="216" y="134" width="120" height="34" rx="17" fill="#1e293b"/><text x="276" y="156" text-anchor="middle" fill="#e2e8f0">hyperlinks</text>
    <rect x="344" y="134" width="88" height="34" rx="17" fill="#134e4a"/><text x="388" y="156" text-anchor="middle" fill="#99f6e4">Quote</text>
    <rect x="440" y="134" width="112" height="34" rx="17" fill="#134e4a"/><text x="496" y="156" text-anchor="middle" fill="#99f6e4">CodeBlock</text>
    <rect x="560" y="134" width="140" height="34" rx="17" fill="#134e4a"/><text x="630" y="156" text-anchor="middle" fill="#99f6e4">HorizontalLine</text>
    <rect x="708" y="134" width="64" height="34" rx="17" fill="#134e4a"/><text x="740" y="156" text-anchor="middle" fill="#99f6e4">Task</text>
    <rect x="780" y="134" width="78" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="819" y="156" text-anchor="middle" fill="#64748b">HWP 5</text>
    <rect x="866" y="134" width="78" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="905" y="156" text-anchor="middle" fill="#64748b">HWPX</text>
    <rect x="952" y="134" width="78" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="991" y="156" text-anchor="middle" fill="#64748b">HWP 3</text>
    <rect x="1038" y="134" width="64" height="34" rx="17" fill="#0b1220" stroke="#334155"/><text x="1070" y="156" text-anchor="middle" fill="#64748b">HML</text>
  </g>

  <text x="40" y="208" fill="#64748b" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="12" font-weight="700" letter-spacing="2">NOT YET ON HANGUL</text>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700">
    <rect x="40" y="222" width="90" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="85" y="242" text-anchor="middle" fill="#64748b">images</text>
    <rect x="138" y="222" width="100" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="188" y="242" text-anchor="middle" fill="#64748b">highlight</text>
    <rect x="246" y="222" width="70" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="281" y="242" text-anchor="middle" fill="#64748b">lists</text>
    <rect x="324" y="222" width="124" height="30" rx="15" fill="#0b1220" stroke="#334155"/><text x="386" y="242" text-anchor="middle" fill="#64748b">table headers</text>
  </g>
  <text x="552" y="242" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="13">not claimed: OCR · VLM · OmniDocBench</text>
</svg>
