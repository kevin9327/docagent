<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Shipped IR marks: PNG and JPEG on MD HTML PDF DOCX ODT. PDF float, cell images, page header/footer. DOCX wrapSquare, behindDoc, inFront. ODT nested lists, tight wrap, cell images. HTML reads img data-URI, lists, table headers, blockquote, pre, a, mark — not HTML5. Hangul CHAR_SHAPE, hyperlinks, Quote, CodeBlock, HorizontalLine, Task, highlight, Bullet/Number lists, table headers except HWP 3. Dash on Hangul: images. No OCR or OmniDocBench.">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" rx="24" fill="url(#sbg)"/>
  <text x="40" y="36" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="3">SHIPS ON ONE IR — NOT A VLM, NOT OCR</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="50" width="66" height="32" rx="16" fill="#134e4a"/><text x="73" y="71" text-anchor="middle" fill="#99f6e4">lists</text>
