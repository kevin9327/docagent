  <text x="40" y="118" fill="#94a3b8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="2">IMAGES — FIVE CODECS, ONE XOBJECT</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
    <rect x="40" y="134" width="118" height="34" rx="17" fill="#134e4a"/><text x="99" y="156" text-anchor="middle" fill="#99f6e4">Markdown</text>
    <rect x="166" y="134" width="86" height="34" rx="17" fill="#134e4a"/><text x="209" y="156" text-anchor="middle" fill="#99f6e4">HTML</text>
