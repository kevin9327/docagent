      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" rx="24" fill="url(#sbg)"/>
  <text x="40" y="36" fill="#5eead4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="13" font-weight="700" letter-spacing="3">SHIPS ON ONE IR — PICTURE IN, PDF/A OUT — NOT OCR</text>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" font-size="14" font-weight="700">
