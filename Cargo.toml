[workspace]
resolver = "2"
members = [
    "crates/docagent-model",
    "crates/docagent-docx",
    "crates/docagent-md",
    "crates/docagent-odt",
    "crates/docagent-hwp5",
    "crates/docagent-hwpx",
    "crates/docagent-hwp3",
    "crates/docagent-hml",
    "crates/docagent-font",
    "crates/docagent-layout",
    "crates/docagent-paint",
    "crates/docagent-raster",
    "crates/docagent-pdf",
    "crates/docagent-html",
    "crates/docagent-capsule",
    "crates/docagent-api",
    "crates/docagent-component",
    "crates/docagent-cli",
    "crates/docagent-mcp",
    "crates/docagent-conformance",
    "crates/docagent-codec-template",
    "tools/docagent-lint",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["DocAgent contributors"]
repository = "https://github.com/kevin9327/docagent"
rust-version = "1.93"
description = "Deterministic document runtime for agents (DOCX, ODT, Markdown, PDF/A, HTML)"

[workspace.dependencies]
docagent-model = { path = "crates/docagent-model" }
docagent-docx = { path = "crates/docagent-docx" }
docagent-md = { path = "crates/docagent-md" }
docagent-odt = { path = "crates/docagent-odt" }
docagent-hwp5 = { path = "crates/docagent-hwp5" }
docagent-hwpx = { path = "crates/docagent-hwpx" }
docagent-hwp3 = { path = "crates/docagent-hwp3" }
docagent-hml = { path = "crates/docagent-hml" }
docagent-font = { path = "crates/docagent-font" }
docagent-layout = { path = "crates/docagent-layout" }
docagent-paint = { path = "crates/docagent-paint" }
docagent-raster = { path = "crates/docagent-raster" }
docagent-pdf = { path = "crates/docagent-pdf" }
docagent-html = { path = "crates/docagent-html" }
docagent-capsule = { path = "crates/docagent-capsule" }
docagent-api = { path = "crates/docagent-api" }
docagent-conformance = { path = "crates/docagent-conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cfb = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
flate2 = "1"
rustybuzz = "0.20"
ttf-parser = "0.25"
tiny-skia = "0.11"
comemo = "0.4"
rayon = "1.10"
rkyv = { version = "0.8", features = ["bytecheck"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
krilla = "0.8"
ts-rs = "10"
anyhow = "1"
bytes = "1"
proptest = "1"
insta = "1"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
