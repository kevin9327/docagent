[workspace]
resolver = "2"
members = [
    "crates/dochwp-model",
    "crates/dochwp-hwp5",
    "crates/dochwp-hwpx",
    "crates/dochwp-hwp3",
    "crates/dochwp-hml",
    "crates/dochwp-docx",
    "crates/dochwp-font",
    "crates/dochwp-layout",
    "crates/dochwp-paint",
    "crates/dochwp-raster",
    "crates/dochwp-pdf",
    "crates/dochwp-html",
    "crates/dochwp-capsule",
    "crates/dochwp-api",
    "crates/dochwp-component",
    "crates/dochwp-cli",
    "crates/dochwp-mcp",
    "crates/dochwp-conformance",
    "crates/dochwp-codec-template",
    "tools/dochwp-lint",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["DocHWP contributors"]
repository = "https://github.com/kevin9327/dochwp"
rust-version = "1.93"
description = "Deterministic flow-document runtime for agents"

[workspace.dependencies]
dochwp-model = { path = "crates/dochwp-model" }
dochwp-hwp5 = { path = "crates/dochwp-hwp5" }
dochwp-hwpx = { path = "crates/dochwp-hwpx" }
dochwp-hwp3 = { path = "crates/dochwp-hwp3" }
dochwp-hml = { path = "crates/dochwp-hml" }
dochwp-docx = { path = "crates/dochwp-docx" }
dochwp-font = { path = "crates/dochwp-font" }
dochwp-layout = { path = "crates/dochwp-layout" }
dochwp-paint = { path = "crates/dochwp-paint" }
dochwp-raster = { path = "crates/dochwp-raster" }
dochwp-pdf = { path = "crates/dochwp-pdf" }
dochwp-html = { path = "crates/dochwp-html" }
dochwp-capsule = { path = "crates/dochwp-capsule" }
dochwp-api = { path = "crates/dochwp-api" }
dochwp-conformance = { path = "crates/dochwp-conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cfb = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
flate2 = "1"
rustybuzz = "0.20"
ttf-parser = "0.25"
tiny-skia = "0.11"
comemo = "0.4"
rayon = "1.10"
rkyv = { version = "0.8", features = ["bytecheck"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
krilla = "0.8"
ts-rs = "10"
anyhow = "1"
bytes = "1"
proptest = "1"
insta = "1"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
